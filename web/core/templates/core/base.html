<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 VoiceGuard Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000 !important;
            color: #fff;
        }
        .full-screen-bg {
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
        .neon-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00d4ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        .neon-input:focus {
            border-color: #7b00ff;
            box-shadow: 0 0 20px rgba(123, 0, 255, 0.5);
            outline: none;
        }
        .neon-btn {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            transition: all 0.4s;
        }
        .neon-btn:hover {
            background: #00d4ff;
            color: #000;
            box-shadow: 0 0 30px #00d4ff;
        }
    </style>
</head>
<body>
    {% if request.path != '/' and request.path != '/login/' %}
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="{% url 'home' %}">🔐 VoiceGuard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link fw-bold" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="{% url 'admin_dashboard' %}">Control Panel</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="{% url 'logout' %}">Sign Out</a></li>
            </ul>
        </div>
    </div>
</nav>
{% endif %}

    <div class="container mt-5 pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
